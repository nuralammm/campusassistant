services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: campus_assistant
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - campus_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus_assistant"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  campus_db:
