[project]
name = "campus-assistant"
version = "0.2.0"
description = "Evidence-grounded academic outcome and intervention pilot"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2,<3", "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/campus_assistant"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
